name: Build and publish latest Windows package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rolling-latest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve release version
        id: release-version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "VERSION is invalid: $version"
          }
          "CAM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Download the pinned Codex CLI runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.tools/codex-cli' | Out-Null
          npm install --prefix '.tools/codex-cli' --no-package-lock --ignore-scripts '@openai/codex@0.154.0'

      - name: Build and package Windows
        shell: pwsh
        run: |
          $env:CODEX_ACCOUNT_MANAGER_DOTNET = (Get-Command dotnet).Source
          $env:CODEX_ACCOUNT_MANAGER_CODEX_RUNTIME = (Resolve-Path '.tools/codex-cli/node_modules').Path
          $env:CODEX_ACCOUNT_MANAGER_SKIP_WINDOWS_CLIENT_SELF_TEST = '1'
          & .\Build-CodexAccountManager.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows application build failed.' }
          & .\Build-OneClickInstallerPackage.ps1 -OutputPath (Join-Path $PWD 'CodexAccountManager-Windows-latest.zip')
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer package build failed.' }
          $versionedPackage = 'CodexAccountManager-Windows-{0}.zip' -f $env:CAM_VERSION
          Copy-Item -LiteralPath 'CodexAccountManager-Windows-latest.zip' -Destination $versionedPackage
          $packageHash = (Get-FileHash -LiteralPath 'CodexAccountManager-Windows-latest.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $packageHash |
            Set-Content -LiteralPath 'CodexAccountManager-Windows-latest.zip.sha256' -Encoding ascii
          $packageHash |
            Set-Content -LiteralPath ($versionedPackage + '.sha256') -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package
          path: |
            CodexAccountManager-Windows-latest.zip
            CodexAccountManager-Windows-latest.zip.sha256
            CodexAccountManager-Windows-${{ steps.release-version.outputs.version }}.zip
            CodexAccountManager-Windows-${{ steps.release-version.outputs.version }}.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish rolling latest release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CAM_VERSION: ${{ needs.build-windows.outputs.version }}
    steps:
      - name: Download built packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create update manifest
        shell: bash
        env:
          CAM_VERSION: ${{ env.CAM_VERSION }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path('release-assets')

          def read_sha256(name):
              value = (root / name).read_text(encoding='ascii').strip().split()[0]
              if not re.fullmatch(r'[0-9a-fA-F]{64}', value):
                  raise SystemExit(f'invalid SHA256 file: {name}')
              return value.lower()

          payload = {
              'schemaVersion': 1,
              'version': os.environ['CAM_VERSION'],
              'commit': os.environ['GITHUB_SHA'],
              'releaseTag': 'latest',
              'assets': {
                  'windows': {
                      'name': f"CodexAccountManager-Windows-{os.environ['CAM_VERSION']}.zip",
                      'sha256': read_sha256(f"CodexAccountManager-Windows-{os.environ['CAM_VERSION']}.zip.sha256"),
                  },
              },
          }
          (root / 'update-manifest.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      # Publish the immutable updater package before switching the manifest. Existing
      # clients can keep using the previous manifest/package pair during this upload.
      - name: Publish versioned automatic-update package
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Codex Account Manager ${{ env.CAM_VERSION }}
          body: |
            自动构建版本 `${{ env.CAM_VERSION }}`。

            包含旧会话用量漏统计修复、账号轮换修复、逐账号代理与模型目录支持，并自动同步桌面、开始菜单及任务栏快捷方式。

            安装包内置 Codex CLI 0.154.0 和模型目录。发布前已针对 Windows 桌面包 26.908.9136.0 的 app-server 验证网关配置和模型目录。模型是否可用以账号及上游授权为准。

            Windows 用户可在管理器中检查更新，或下载下方 Windows 安装包。更新后重新启动管理器和 Codex，使请求经过新版网关；使用 GPT-6 仍需账号或 API 服务支持该模型。
          prerelease: true
          make_latest: false
          files: |
            release-assets/CodexAccountManager-Windows-${{ env.CAM_VERSION }}.zip
            release-assets/CodexAccountManager-Windows-${{ env.CAM_VERSION }}.zip.sha256
          fail_on_unmatched_files: true

      - name: Publish update manifest after versioned package
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Codex Account Manager ${{ env.CAM_VERSION }}
          prerelease: true
          make_latest: false
          files: |
            release-assets/update-manifest.json
          fail_on_unmatched_files: true

      - name: Replace stable manual-download package
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Codex Account Manager ${{ env.CAM_VERSION }}
          prerelease: true
          make_latest: false
          files: |
            release-assets/CodexAccountManager-Windows-latest.zip
            release-assets/CodexAccountManager-Windows-latest.zip.sha256
          fail_on_unmatched_files: true

      - name: Move rolling latest tag to the published commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${{ github.repository }}/git/refs/tags/latest" \
            -f sha="${{ github.sha }}" \
            -F force=true

      - name: Remove obsolete release downloads after successful publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" > current-release.json
          python3 - <<'PY'
          import json, os, subprocess
          release = json.load(open('current-release.json', encoding='utf-8'))
          version = os.environ['CAM_VERSION']
          keep = {
              'update-manifest.json',
              'CodexAccountManager-Windows-latest.zip',
              'CodexAccountManager-Windows-latest.zip.sha256',
              f'CodexAccountManager-Windows-{version}.zip',
              f'CodexAccountManager-Windows-{version}.zip.sha256',
          }
          present = {a['name'] for a in release['assets'] if a['state'] == 'uploaded' and a['size'] > 0}
          if not keep.issubset(present):
              raise SystemExit('New release incomplete; no old assets were removed.')
          for asset in release['assets']:
              if asset['name'] not in keep and asset['name'].startswith('CodexAccountManager-'):
                  subprocess.run(['gh', 'api', '--method', 'DELETE',
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset['id']}"], check=True)
                  print('Removed obsolete asset:', asset['name'])
          PY
