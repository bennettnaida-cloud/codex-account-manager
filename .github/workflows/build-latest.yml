name: Build and publish latest Windows and macOS packages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rolling-latest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve release version
        id: release-version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "VERSION is invalid: $version"
          }
          $runtimeSource = Get-Content -LiteralPath 'src/CodexAccountManager/ReleaseConfiguration.cs' -Raw
          $runtimeVersions = [regex]::Matches($runtimeSource, 'internal\s+const\s+string\s+Version\s*=\s*"([^"]+)"')
          if ($runtimeVersions.Count -ne 1 -or $runtimeVersions[0].Groups[1].Value -ne $version) {
            throw 'VERSION and ReleaseConfiguration.Version must match before publishing.'
          }
          "CAM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Download the pinned Codex CLI runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.tools/codex-cli' | Out-Null
          npm install --prefix '.tools/codex-cli' --no-package-lock --ignore-scripts '@openai/codex@0.154.0'

      - name: Build and package Windows
        shell: pwsh
        run: |
          $env:CODEX_ACCOUNT_MANAGER_DOTNET = (Get-Command dotnet).Source
          $env:CODEX_ACCOUNT_MANAGER_CODEX_RUNTIME = (Resolve-Path '.tools/codex-cli/node_modules').Path
          $env:CODEX_ACCOUNT_MANAGER_SKIP_WINDOWS_CLIENT_SELF_TEST = '1'
          & .\Build-CodexAccountManager.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows application build failed.' }
          $startupExe = Join-Path $PWD ('dist/CodexAccountManager-{0}/CodexAccountManager.exe' -f $env:CAM_VERSION)
          $builtVersion = ([System.Diagnostics.FileVersionInfo]::GetVersionInfo($startupExe).ProductVersion -split '\+')[0]
          $packageVersion = (Get-Content -LiteralPath (Join-Path (Split-Path $startupExe) 'package-version.txt') -Raw).Trim()
          if ($builtVersion -ne $env:CAM_VERSION -or $packageVersion -ne $env:CAM_VERSION) {
            throw 'Built executable, package marker and release version do not match.'
          }
          $startupTest = Start-Process -FilePath $startupExe -ArgumentList '--startup-self-test' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput 'startup-self-test.out' -RedirectStandardError 'startup-self-test.err'
          Get-Content 'startup-self-test.out','startup-self-test.err'
          if ($startupTest.ExitCode -ne 0) { throw 'Windows startup regression test failed.' }
          $atTest = Start-Process -FilePath $startupExe -ArgumentList '--access-token-model-self-test' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput 'at-model-self-test.out' -RedirectStandardError 'at-model-self-test.err'
          Get-Content 'at-model-self-test.out','at-model-self-test.err'
          if ($atTest.ExitCode -ne 0) { throw 'AT remote model discovery regression test failed.' }
          $catalogCli = Join-Path $env:CODEX_ACCOUNT_MANAGER_CODEX_RUNTIME '@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/bin/codex.exe'
          if (-not (Test-Path -LiteralPath $catalogCli -PathType Leaf)) {
            throw 'Bundled Codex CLI is missing; model catalog verification cannot run.'
          }
          & node .\tools\Test-AutomaticModelCatalog.cjs $startupExe $catalogCli
          if ($LASTEXITCODE -ne 0) { throw 'Automatic model catalog regression test failed.' }
          & .\Build-OneClickInstallerPackage.ps1 -OutputPath (Join-Path $PWD 'CodexAccountManager-Windows-latest.zip')
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer package build failed.' }
          $versionedPackage = 'CodexAccountManager-Windows-{0}.zip' -f $env:CAM_VERSION
          Copy-Item -LiteralPath 'CodexAccountManager-Windows-latest.zip' -Destination $versionedPackage
          $packageHash = (Get-FileHash -LiteralPath 'CodexAccountManager-Windows-latest.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $packageHash |
            Set-Content -LiteralPath 'CodexAccountManager-Windows-latest.zip.sha256' -Encoding ascii
          $packageHash |
            Set-Content -LiteralPath ($versionedPackage + '.sha256') -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package
          path: |
            CodexAccountManager-Windows-latest.zip
            CodexAccountManager-Windows-latest.zip.sha256
            CodexAccountManager-Windows-${{ steps.release-version.outputs.version }}.zip
            CodexAccountManager-Windows-${{ steps.release-version.outputs.version }}.zip.sha256
          if-no-files-found: error

  build-macos:
    name: Build and test Apple Silicon package
    runs-on: macos-15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macos/package-lock.json
      - name: Verify platform and release version
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          node -e "const fs=require('fs');const v=fs.readFileSync('VERSION','utf8').trim();if(require('./macos/package.json').version!==v)throw Error('macOS version mismatch');"
          echo "CAM_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Install build dependencies and run macOS regressions
        working-directory: macos
        run: |
          npm ci --ignore-scripts
          npm test
          bash -n packaging/一键安装.command packaging/卸载.command
      - name: Download the pinned official Apple Silicon CLI
        run: |
          mkdir -p dist
          curl --fail --location --retry 3 --output dist/openai-codex-0.154.0-darwin-arm64.tgz https://registry.npmjs.org/@openai/codex/-/codex-0.154.0-darwin-arm64.tgz
      - name: Build and verify macOS package
        working-directory: macos
        run: |
          npm run build:mac -- --output "../dist/CodexAccountManager-macOS-${CAM_VERSION}.zip"
          npm run verify:mac -- "../dist/CodexAccountManager-macOS-${CAM_VERSION}.zip"
      - name: Test native install and rendered application
        working-directory: macos
        run: node scripts/test-installed-macos.mjs "../dist/CodexAccountManager-macOS-${CAM_VERSION}.zip"
      - name: Create latest macOS download alias
        run: |
          cp "dist/CodexAccountManager-macOS-${CAM_VERSION}.zip" dist/CodexAccountManager-macOS-latest.zip
          cd dist
          shasum -a 256 CodexAccountManager-macOS-latest.zip > CodexAccountManager-macOS-latest.zip.sha256
      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-package
          path: |
            dist/CodexAccountManager-macOS-*.zip
            dist/CodexAccountManager-macOS-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish rolling latest release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CAM_VERSION: ${{ needs.build-windows.outputs.version }}
    steps:
      - name: Download built packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create update manifest
        shell: bash
        env:
          CAM_VERSION: ${{ env.CAM_VERSION }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path('release-assets')

          def read_sha256(name):
              value = (root / name).read_text(encoding='ascii').strip().split()[0]
              if not re.fullmatch(r'[0-9a-fA-F]{64}', value):
                  raise SystemExit(f'invalid SHA256 file: {name}')
              return value.lower()

          payload = {
              'schemaVersion': 1,
              'version': os.environ['CAM_VERSION'],
              'commit': os.environ['GITHUB_SHA'],
              'releaseTag': 'latest',
              'assets': {
                  'windows': {
                      'name': f"CodexAccountManager-Windows-{os.environ['CAM_VERSION']}.zip",
                      'sha256': read_sha256(f"CodexAccountManager-Windows-{os.environ['CAM_VERSION']}.zip.sha256"),
                  },
                  'macos': {
                      'name': f"CodexAccountManager-macOS-{os.environ['CAM_VERSION']}.zip",
                      'sha256': read_sha256(f"CodexAccountManager-macOS-{os.environ['CAM_VERSION']}.zip.sha256"),
                  },
              },
          }
          (root / 'update-manifest.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      # Publish the immutable updater package before switching the manifest. Existing
      # clients can keep using the previous manifest/package pair during this upload.
      - name: Publish versioned automatic-update package
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Codex Account Manager ${{ env.CAM_VERSION }}
          body: |
            自动构建版本 `${{ env.CAM_VERSION }}`。

            恢复 macOS Apple Silicon 下载并更新到 2.3.38：内置 Codex CLI 0.154.0、Electron 43.8.1，AT 和兼容 API 在线模型目录在启动及每 15 分钟同步。保留账号模型选择和自定义目录。macOS 与 Windows 必须都通过测试后才更新发布清单，后续发布保留两个平台。

            修复 2.3.37 的 Access Token 模型自动更新读回旧静态目录的问题。现在按账号凭据、工作区身份和绑定代理直接查询官方 Codex 模型目录，保留服务器返回的完整模型元数据，不再把 CLI 内置目录或旧缓存误报为在线刷新成功。

            AT 与兼容 API 模型在管理器启动及每 15 分钟后台检查。失败保留上一份目录；凭据变更后的旧请求不会覆盖新账号目录。保留默认模型、手动目录、OAuth 登录和现有启动功能。已打开的 Codex 可能需要自行重启才能显示新增模型，不强制关闭正在工作的客户端。

            发布流程执行完整自检、启动、AT 在线发现模拟回归、兼容 API 目录专项回归及安装包隐私检查。新模型的实际可用性取决于 Codex 授权、网络和客户端兼容性；Work 的模型列表不等同于 Codex 授权目录。本次不修改官网价格页面的 HTTP 403 行为。

            Mac 包面向 Apple Silicon，安装脚本执行本机 ad-hoc 签名，未作 Developer ID 签名或公证。GitHub 原生 Mac 验证安装、签名、内置 CLI 和界面加载；真实账号登录、语音/手机及模型生成没有在用户 Mac 上实测，不能据此宣称与 Windows 所有功能一致。
          prerelease: true
          make_latest: false
          files: |
            release-assets/CodexAccountManager-Windows-${{ env.CAM_VERSION }}.zip
            release-assets/CodexAccountManager-Windows-${{ env.CAM_VERSION }}.zip.sha256
            release-assets/CodexAccountManager-macOS-${{ env.CAM_VERSION }}.zip
            release-assets/CodexAccountManager-macOS-${{ env.CAM_VERSION }}.zip.sha256
          fail_on_unmatched_files: true

      - name: Publish update manifest after versioned package
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Codex Account Manager ${{ env.CAM_VERSION }}
          prerelease: true
          make_latest: false
          files: |
            release-assets/update-manifest.json
          fail_on_unmatched_files: true

      - name: Replace stable manual-download package
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Codex Account Manager ${{ env.CAM_VERSION }}
          prerelease: true
          make_latest: false
          files: |
            release-assets/CodexAccountManager-Windows-latest.zip
            release-assets/CodexAccountManager-Windows-latest.zip.sha256
            release-assets/CodexAccountManager-macOS-latest.zip
            release-assets/CodexAccountManager-macOS-latest.zip.sha256
          fail_on_unmatched_files: true

      - name: Move rolling latest tag to the published commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${{ github.repository }}/git/refs/tags/latest" \
            -f sha="${{ github.sha }}" \
            -F force=true

      - name: Remove obsolete release downloads after successful publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" > current-release.json
          python3 - <<'PY'
          import json, os, subprocess
          release = json.load(open('current-release.json', encoding='utf-8'))
          version = os.environ['CAM_VERSION']
          keep = {
              'update-manifest.json',
              'CodexAccountManager-Windows-latest.zip',
              'CodexAccountManager-Windows-latest.zip.sha256',
              f'CodexAccountManager-Windows-{version}.zip',
              f'CodexAccountManager-Windows-{version}.zip.sha256',
              'CodexAccountManager-macOS-latest.zip',
              'CodexAccountManager-macOS-latest.zip.sha256',
              f'CodexAccountManager-macOS-{version}.zip',
              f'CodexAccountManager-macOS-{version}.zip.sha256',
          }
          present = {a['name'] for a in release['assets'] if a['state'] == 'uploaded' and a['size'] > 0}
          if not keep.issubset(present):
              raise SystemExit('New release incomplete; no old assets were removed.')
          for asset in release['assets']:
              if asset['name'] not in keep and asset['name'].startswith('CodexAccountManager-'):
                  subprocess.run(['gh', 'api', '--method', 'DELETE',
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset['id']}"], check=True)
                  print('Removed obsolete asset:', asset['name'])
          PY
